<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuraganTravel | Admin Login</title>
    
    <!-- Google Fonts: Google Sans Flex -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Google Sans Flex"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            400: '#34d399',
                            500: '#10b981', // Emerald Green
                            600: '#059669', // Deep Emerald
                            800: '#065f46',
                            900: '#022c22', // Very Dark Green (Premium)
                        },
                        accent: {
                            400: '#fbbf24', // Warm Gold
                            500: '#f59e0b', 
                        }
                    },
                    boxShadow: {
                        'soft': '0 20px 40px -15px rgba(0,0,0,0.05)',
                        'floating': '0 30px 60px -20px rgba(2, 44, 34, 0.15)',
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        
        /* Subtle background blob pattern for centered layout */
        .bg-blob-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(circle at 85% 10%, #d1fae5 0%, transparent 40%),
                              radial-gradient(circle at 15% 90%, #fef3c7 0%, transparent 40%);
        }
    </style>
</head>
<body class="font-sans text-gray-800 antialiased selection:bg-brand-500 selection:text-white min-h-screen flex items-center justify-center p-4 sm:p-8 relative bg-blob-pattern overflow-hidden">

    <!-- Centered Login Form Container -->
    <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-[2rem] shadow-floating border border-gray-100 relative z-10 mx-auto">
        
        <!-- Header Logo -->
        <div class="flex items-center justify-center gap-3 mb-10 opacity-0 animate-fade-in-up">
            <div class="bg-brand-500 text-white p-2.5 rounded-xl shrink-0 shadow-lg shadow-brand-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
            </div>
            <span class="font-extrabold text-2xl tracking-tight text-brand-900">Juragan<span class="text-brand-500">Travel</span></span>
        </div>

        <div class="mb-10 text-center opacity-0 animate-fade-in-up delay-100">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 mb-2 tracking-tight">Welcome Back</h2>
            <p class="text-gray-500 font-medium">Please sign in to your admin account.</p>
        </div>

        <form id="login-form" class="space-y-6 opacity-0 animate-fade-in-up delay-200">
            
            <!-- Email Input -->
            <div class="space-y-2 text-left">
                <label for="email" class="block text-xs font-bold text-gray-600 uppercase tracking-widest">Admin Email</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400 group-focus-within:text-brand-500 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    </div>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@juragantravel.com" 
                        class="block w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl text-gray-900 font-medium placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 focus:bg-white transition-all duration-300">
                </div>
            </div>

            <!-- Password Input -->
            <div class="space-y-2 text-left">
                <label for="password" class="block text-xs font-bold text-gray-600 uppercase tracking-widest">Password</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="w-5 h-5 text-gray-400 group-focus-within:text-brand-500 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" 
                        class="block w-full pl-11 pr-12 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl text-gray-900 font-medium placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 focus:bg-white transition-all duration-300">
                    
                    <!-- Toggle Password Visibility -->
                    <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-brand-600 focus:outline-none transition-colors">
                        <!-- Eye Icon -->
                        <svg id="eye-icon" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                        <!-- Eye Off Icon (Hidden initially) -->
                        <svg id="eye-off-icon" class="w-5 h-5 hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                    </button>
                </div>
            </div>

            <!-- Remember Me (No forgot password) -->
            <div class="flex items-center pt-2">
                <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-brand-500 focus:ring-brand-500 cursor-pointer accent-brand-500">
                <label for="remember-me" class="ml-2 block text-sm font-medium text-gray-600 cursor-pointer">
                    Remember me on this device
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full flex justify-center items-center gap-2 py-4 px-4 border border-transparent rounded-2xl shadow-lg shadow-brand-900/20 text-base font-bold text-white bg-brand-900 hover:bg-brand-800 hover:-translate-y-1 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-900 mt-4">
                <span>Enter Dashboard</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
        </form>

        <div class="mt-8 text-center opacity-0 animate-fade-in-up delay-300">
            <p class="text-xs font-medium text-gray-400">
                &copy; 2026 JuraganTravel. Restricted Access System.
            </p>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Password Visibility Toggle Logic
            const togglePasswordBtn = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            const eyeOffIcon = document.getElementById('eye-off-icon');

            togglePasswordBtn.addEventListener('click', () => {
                // Toggle the type attribute
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Toggle icons
                eyeIcon.classList.toggle('hidden');
                eyeOffIcon.classList.toggle('hidden');
            });

            // Form Submit Logic (Mock)
            const loginForm = document.getElementById('login-form');
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const btn = loginForm.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                
                // Show loading state
                btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Processing...`;
                btn.disabled = true;

                // Simulate API call
                setTimeout(() => {
                    alert('Login successful! (This is a mock form)');
                    // Reset button
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    
                    // In a real app, you would redirect here:
                    // window.location.href = 'admin.html';
                }, 1500);
            });
        });
    </script>
</body>
</html>
